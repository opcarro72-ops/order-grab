      margin-top:30px;

      }

const currentTexts =
  withdrawTexts[lang] || withdrawTexts.en;

document.querySelector(
  '[data-lang="withdrawRecords"]'
).innerText = currentTexts.withdrawRecords;

function translateStatus(status) {
  if (status === "Success") {
    return currentTexts.success;
  }

  if (status === "Rejected") {
    return currentTexts.rejected;
  }

  if (status === "Processing") {
    return currentTexts.processing;
  }
  return status;
}

async function loadWithdrawRecords() {
  const token = localStorage.getItem("token");
  const box = document.getElementById("recordList");

  if (!token) {
    box.innerHTML =
      `<p class="empty">${currentTexts.userNotLoggedIn}</p>`;
    return;
  }

  box.innerHTML =
    `<p class="empty">${currentTexts.loading}</p>`;
  try {

    const res = await fetch("/my-withdraws", {
      headers: {
        "Authorization": "Bearer " + token
      }
    });

    const records = await res.json();

    if (!Array.isArray(records) || records.length === 0) {
      box.innerHTML =
        `<p class="empty">${currentTexts.noWithdrawalRecords}</p>`;
      return;
    }
    box.innerHTML = "";
    records.forEach(r => {
      let statusClass = "processing";
      if (r.status === "Success") {
        statusClass = "success";
      }

      if (r.status === "Rejected") {
        statusClass = "rejected";
      }
      const displayAmount =
        r.approvedAmount > 0
          ? r.approvedAmount
          : r.amount;
      box.innerHTML += `
        <div class="record-item">
          <div class="status ${statusClass}">
            ${translateStatus(r.status)}
          </div>
          <p>
            ${currentTexts.amount}: ${displayAmount} USDT
          </p>
          <p>
            ${currentTexts.time}: ${new Date(r.time).toLocaleString()}
          </p>
        </div>
      `;
    });
  } catch (error) {
    box.innerHTML =
      `<p class="empty">${currentTexts.serverErrorLoadingRecords}</p>`;
  }
}

loadWithdrawRecords();
