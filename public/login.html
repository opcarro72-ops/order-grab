<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="logo.png">

  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#f5f5f5;
    }

    .container{
      padding:20px;
      max-width:920px;
      margin:auto;
    }

    .top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-top:10px;
    }

    .lang{
  border:1px solid #ddd;
  padding:6px 10px;
  border-radius:8px;
  font-size:14px;
  background:#fff;
  cursor:pointer;
}

.current-flag{
  width:24px;
  height:16px;
  object-fit:cover;
  border-radius:2px;
  vertical-align:middle;
  margin-right:6px;
}

.language-popup-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.35);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

.language-popup{
  width:320px;
  max-width:90%;
  max-height:70vh;
  background:#fff;
  border-radius:12px;
  overflow-y:auto;
  box-shadow:0 8px 30px rgba(0,0,0,0.25);
}

.language-option{
  display:flex;
  align-items:center;
  gap:10px;
  padding:13px 16px;
  border-bottom:1px solid #eee;
  font-size:14px;
  color:#333;
  cursor:pointer;
  background:#fff;
}

.language-option:hover{
  background:#f5f5f5;
}

.language-option:last-child{
  border-bottom:none;
}

.flag{
  width:24px;
  height:16px;
  object-fit:cover;
  border-radius:2px;
  flex-shrink:0;
}

    h1{
      margin-top:40px;
      font-size:22px;
      color:#555;
    }

    h2{
      margin-top:10px;
      font-size:26px;
      color:#333;
    }

    .input-box{
      background:#fff;
      border:1px solid #ddd;
      border-radius:10px;
      padding:12px;
      margin-top:15px;
      display:flex;
      align-items:center;
    }

    .input-box input{
      border:none;
      outline:none;
      width:100%;
      font-size:16px;
      background:transparent;
    }

    .remember{
      margin-top:15px;
      font-size:14px;
      color:#444;
    }

    .login-btn{
      margin-top:20px;
      width:100%;
      padding:14px;
      background:#32a50f;
      color:white;
      border:none;
      border-radius:10px;
      font-size:16px;
      cursor:pointer;
    }

    .register{
      text-align:right;
      margin-top:15px;
      color:#c90a0a;
      cursor:pointer;
    }

    .custom-message{
  position:fixed;
  top:30px;
  left:50%;
  transform:translateX(-50%);
  background:#222;
  color:#fff;
  padding:14px 25px;
  border-radius:10px;
  font-size:16px;
  z-index:9999;
  display:none;
  animation:fadeIn 0.3s ease;
}

@keyframes fadeIn{
  from{
    opacity:0;
    transform:translateX(-50%) translateY(-10px);
  }

  to{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
}
  </style>
</head>

<body>

<div class="container">

  <div class="top">
  <div></div>

  <div class="lang" onclick="toggleLanguage()" id="currentLanguage">
  <img src="flags/gb.png" class="current-flag">
  <span>English</span>
</div>

</div>

<div id="languagePopupOverlay" class="language-popup-overlay">

  <div class="language-popup">

    <div class="language-option" onclick="changeLang('en')">
      <img src="flags/gb.png" class="flag">
      <span>English</span>
    </div>

    <div class="language-option" onclick="changeLang('zh')">
      <img src="flags/cn.png" class="flag">
      <span>中文（简体）</span>
    </div>

    <div class="language-option" onclick="changeLang('hi')">
      <img src="flags/in.png" class="flag">
      <span>हिंदी</span>
    </div>

    <div class="language-option" onclick="changeLang('es')">
      <img src="flags/es.png" class="flag">
      <span>Español</span>
    </div>

    <div class="language-option" onclick="changeLang('fr')">
      <img src="flags/fr.png" class="flag">
      <span>Français</span>
    </div>

    <div class="language-option" onclick="changeLang('ar')">
      <img src="flags/sa.png" class="flag">
      <span>العربية</span>
    </div>

    <div class="language-option" onclick="changeLang('bn')">
      <img src="flags/bd.png" class="flag">
      <span>বাংলা</span>
    </div>

    <div class="language-option" onclick="changeLang('pt')">
      <img src="flags/pt.png" class="flag">
      <span>Português</span>
    </div>

    <div class="language-option" onclick="changeLang('ru')">
      <img src="flags/ru.png" class="flag">
      <span>Русский</span>
    </div>

    <div class="language-option" onclick="changeLang('ur')">
      <img src="flags/pk.png" class="flag">
      <span>اردو</span>
    </div>

    <div class="language-option" onclick="changeLang('id')">
      <img src="flags/id.png" class="flag">
      <span>Bahasa Indonesia</span>
    </div>

    <div class="language-option" onclick="changeLang('de')">
      <img src="flags/de.png" class="flag">
      <span>Deutsch</span>
    </div>

    <div class="language-option" onclick="changeLang('ja')">
      <img src="flags/jp.png" class="flag">
      <span>日本語</span>
    </div>

    <div class="language-option" onclick="changeLang('it')">
      <img src="flags/it.png" class="flag">
      <span>Italiano</span>
    </div>

    <div class="language-option" onclick="changeLang('tr')">
      <img src="flags/tr.png" class="flag">
      <span>Türkçe</span>
    </div>

    <div class="language-option" onclick="changeLang('fa')">
      <img src="flags/ir.png" class="flag">
      <span>فارسی</span>
    </div>

    <div class="language-option" onclick="changeLang('nl')">
      <img src="flags/nl.png" class="flag">
      <span>Nederlands</span>
    </div>

  </div>

</div>

  <h1>Hello,Welcome!</h1>
  <h2>Login</h2>

  <div class="input-box">
    <input id="username" placeholder="6-16 letters or numbers">
  </div>

  <div class="input-box">
    <input id="password" type="text" placeholder="6-16 alphanumeric password">
  </div>

  <div class="remember">
  <input type="checkbox" checked>
  <span id="rememberText">Remember password</span>
</div>

  <button class="login-btn" onclick="login()">Login</button>
  <div class="register" onclick="goRegister()">Registration</div>
</div>

<div id="customMessage" class="custom-message"></div>
<script src="login.js"></script>

<script>

if(localStorage.getItem("token")){
  window.location.href = "/home.html";
}

</script>

</body>
</html>
