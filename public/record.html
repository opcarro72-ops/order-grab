<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Record</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f2f2f2;
  color:#333;
}

h2{
  margin:0;
  padding:15px;
  background:#fff;
  border-bottom:1px solid #ddd;
}

.popup-overlay {
  position: static !important;
  width: 100% !important;
  height: auto !important;
  display: block !important;
  background: none !important;
}

html {
  overflow-y: scroll;
}

.order-popup {
  max-width: 420px;
  width: 100%;
  margin: 20px auto;
  max-height: 70vh;
  overflow-y: auto;
  border-radius: 15px;
}

.header{
  text-align:center;
  padding:15px;
  font-size:22px;
  font-weight:bold;
}

.tabs{
  display:flex;
  justify-content:space-around;
  background:#fff;
  border-bottom:1px solid #ddd;
}

.tab{
  padding:12px;
  cursor:pointer;
  color:#190808;
}

.tab.active{
  color:#000000;
  border-bottom:3px solid #159c29;
}

.content{
  padding:15px;
  padding-bottom:80px;
}

.empty{
  text-align:center;
  color:#aaa;
  margin-top:40px;
}

#customAlert{
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: #222;
  color: #fff;
  padding: 14px 16px;
  border-radius: 10px;
  font-size: 14px;
  z-index: 99999;
  display: none;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn{
  from{
    opacity:0;
    transform:translate(-50%, -10px);
  }
  to{
    opacity:1;
    transform:translate(-50%, 0);
  }
}

</style>

</head>

<body>

  <h2 id="recordTitle" style="text-align:center;">Record</h2>

<div class="tabs">

  <div
    class="tab active"
    id="tabIncomplete"
    onclick="switchTab('incomplete')"
  >
    <span id="incompleteText">Incomplete</span>
  </div>

  <div
    class="tab"
    id="tabComplete"
    onclick="switchTab('complete')"
  >
    <span id="completeText">Complete</span>
  </div>

</div>

<div class="content">
  <div id="incompleteTab"></div>
  <div id="completeTab" style="display:none;"></div>
</div>

<div class="bottom-nav">

  <div class="nav-item"
       data-page="home.html"
       onclick="goPage('home.html')">
    <span class="home-icon-box">

          fill="none"

          stroke-width="4"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </span>
    <div id="navHome">Home</div>
  </div>

  <div class="nav-item"
       data-page="service.html"
       onclick="goPage('service.html')">
    <i class="fa-solid fa-headset nav-icon"></i>

  <div class="nav-item"

    <i class="fa-solid fa-bag-shopping nav-icon"></i>
    <div id="navMenu">Menu</div>
  </div>

  <div class="nav-item active"

    <i class="fa-regular fa-clipboard nav-icon"></i>

  <div class="nav-item"

    <i class="fa-regular fa-user nav-icon"></i>
    <div id="navMine">Mine</div>

</div>

<div id="customAlert"></div>

function switchTab(tab){

  document.getElementById("incompleteTab").style.display =
    tab === "incomplete" ? "block" : "none";
  document.getElementById("completeTab").style.display =
    tab === "complete" ? "block" : "none";
  document.getElementById("tabIncomplete").classList.toggle(
    "active",
    tab === "incomplete"
  );
  document.getElementById("tabComplete").classList.toggle(
    "active",
    tab === "complete"
  );
}
