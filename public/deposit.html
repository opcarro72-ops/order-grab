const currentTexts =
  depositTexts[lang] || depositTexts.en;

document.getElementById("depositTitle").innerText =
  currentTexts.title;

document.getElementById("paymentMethodText").innerText =
  currentTexts.paymentMethod;

document.getElementById("protocolText").innerText =
  currentTexts.protocol;

document.getElementById("currencySelectionText").innerText =
  currentTexts.currencySelection;

document.getElementById("depositAmountText").innerText =
  currentTexts.depositAmount;

document.getElementById("amountInput").placeholder =
  currentTexts.enterAmount;

document.getElementById("depositAmountHint").innerText =
  currentTexts.amountHint;

document.getElementById("estimatedPaymentText").innerText =
  currentTexts.estimatedPayment;

document.getElementById("depositBtn").innerText =
  currentTexts.depositNow;

const amountInput = document.getElementById("amountInput");
const depositBtn = document.getElementById("depositBtn");
const showAmount = document.getElementById("showAmount");

amountInput.addEventListener("input", () => {
  let amount = parseFloat(amountInput.value) || 0;

  showAmount.innerText = amount;

  if (amount >= 0.1) {
    depositBtn.disabled = false;
    depositBtn.classList.add("active");
  } else {
    depositBtn.disabled = true;
    depositBtn.classList.remove("active");
  }
});

async function goNext() {
  let amount = parseFloat(amountInput.value) || 0;
  const token = localStorage.getItem("token");

  if (amount < 0.1) return;

  const res = await fetch("/deposit-request", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + token
    },
    body: JSON.stringify({ amount })
  });

  const data = await res.json();

  if (data.pending) {
    localStorage.setItem("depositAmount", data.amount);
    localStorage.setItem("depositWarning", data.msg);
    window.location.href = "payment.html";
    return;
  }

  if (data.success) {
    localStorage.setItem("depositAmount", amount);
    localStorage.removeItem("depositWarning");
    window.location.href = "payment.html";
  } else {
    alert(data.msg);
  }
}

function goBack() {
  window.history.back();
}
