const currentTexts =
  withdrawTexts[lang] || withdrawTexts.en;

  currentTexts.title;
document.getElementById("currencyText").innerHTML =
  currentTexts.currency;
document.getElementById("walletTitle").innerText =
  currentTexts.wallet;
document.getElementById("walletName").innerText =
  currentTexts.noWallet;
document.getElementById("maximumText").innerText =
  currentTexts.maximum;
document.getElementById("okBtn").innerText =
  currentTexts.ok;

const amountInput =
  document.getElementById("amount");
const okBtn =
  document.getElementById("okBtn");
const token =
  localStorage.getItem("token");

function showMessage(text) {
  const alertBox =
    document.getElementById("customAlert");
  alertBox.innerText =
    text;
  alertBox.style.display =
    "block";
  setTimeout(() => {
    alertBox.style.display =
      "none";
  }, 3000);

}

async function loadWallet() {

  if (
    sessionStorage.getItem("withdrawAccess")
    !== "true"
  ) {

    showMessage(
      currentTexts.accessDenied
    );
    window.location.href =
      "mine.html";
    return;
  }

  try {

    const res =
      await fetch("/get-wallet", {
        headers: {
          Authorization:
            "Bearer " + token
        }
      });

    const data =
      await res.json();
    if (
      !data.success ||
      !data.wallet ||
      !data.wallet.locked
    ) {
      showMessage(
        currentTexts.addWallet
      );
      window.location.href =
        "wallet.html";
      return;
    }

    window.walletData =
      data.wallet;
    document.getElementById(
      "walletName"
    ).innerText =
      data.wallet.name +
      " (" +
      data.wallet.protocol +
      ")";

  } catch (err) {
    showMessage(
      currentTexts.serverError
    );
  }
}

loadWallet();

amountInput.addEventListener(
  "input",
  () => {
    let amount =
      parseFloat(amountInput.value) || 0;

    if (amount >= 10) {
      okBtn.disabled =
        false;
      okBtn.classList.add(
        "active"
      );
    } else {
      okBtn.disabled =
        true;
      okBtn.classList.remove(
        "active"
      );
    }
  }
);

okBtn.addEventListener(
  "click",
  async () => {

    let amount =
      parseFloat(amountInput.value);
    if (!window.walletData) {
      showMessage(
        currentTexts.addWallet
      );
      return;
    }

    if (amount < 10) {
      showMessage(
        currentTexts.minimum
      );
      return;
    }

    okBtn.disabled =
      true;

    okBtn.innerText =
      currentTexts.processing;

    const token =
      localStorage.getItem("token");

    try {

      const res =
        await fetch("/withdraw", {
          method: "POST",
          headers: {
            "Content-Type":
              "application/json",
            "Authorization":
              "Bearer " + token
          },

          body: JSON.stringify({
            amount
          })
        });

      const result =
        await res.json();

      if (result.success) {
        showMessage(
          currentTexts.submitted
        );

        setTimeout(() => {
          window.location.href =
            "mine.html";
        }, 3000);

      } else {

        let message =
          result.msg || "";

        if (
          message ===
          "You have successfully submitted for withdrawal, please wait patiently."
        ) {
          message =
            currentTexts.pending;
        }

        else if (
          message ===
          "Not enough balance"
        ) {
          message =
            currentTexts.insufficient;
        }

        else if (
          message ===
          "Invalid withdraw amount"
        ) {
          message =
            currentTexts.minimum;
        }

        else {
          message =
            result.msg ||
            currentTexts.failed;
        }

        showMessage(message);
        okBtn.disabled =
          false;
        okBtn.innerText =
          currentTexts.ok;

      }

    } catch (err) {

      showMessage(
        currentTexts.serverError
      );
      okBtn.disabled =
        false;
      okBtn.innerText =
        currentTexts.ok;
    }
  }
);

window.addEventListener(
  "pagehide",
  () => {
    sessionStorage.removeItem(
      "withdrawAccess"
    );
  }
);
