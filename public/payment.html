  currentTexts.tip3End;

let warning =
  localStorage.getItem("depositWarning");
document.getElementById("amountText").innerText =
  amount + " USDT";

let address = "";
const token =
  localStorage.getItem("token");

fetch("/deposit-request", {
  method: "POST",
  headers: {
    "Content-Type": "application/json",
    "Authorization": "Bearer " + token
  },
  body: JSON.stringify({
    amount
  })

})

.then(res => res.json())
.then(data => {
  if (data.address) {
    address = data.address;
    document.getElementById("address").value =
      data.address;
    document.getElementById("qrImage").src =
      data.qr;
  }

});

if (warning && warning !== "null") {
  let translatedWarning =
    currentTexts.pending;
  document.getElementById("addressTitle").innerHTML =
    `<span style="color:red;">${translatedWarning}</span>`;
} else {
  document.getElementById("addressTitle").innerText =
    currentTexts.address;
}

function copyAddress() {
  navigator.clipboard.writeText(address);
  document.getElementById("msg").innerText =
    currentTexts.copied;
}

function goPage(page) {
  window.location.href = page;
}
