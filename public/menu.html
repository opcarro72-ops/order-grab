<script>

function goPage(page) {
  window.location.href = page;
}

const currentPage = window.location.pathname.split("/").pop();
document.querySelectorAll(".nav-item").forEach(item => {
  if (item.getAttribute("data-page") === currentPage) {
    item.classList.add("active");
  }
});

function filterCards(type, el) {
  document
    .querySelectorAll(".tab")
    .forEach(t => t.classList.remove("active"));
  el.classList.add("active");
  document
    .querySelectorAll(".menu-card")
    .forEach(card => {
      if (type === "all" || card.dataset.vip === type) {
        card.style.display = "flex";
      } else {
        card.style.display = "none";
      }
    });
}

function applyMenuLanguage() {

  const selectedLang =
    localStorage.getItem("lang") || "en";

  const t =
    menuTranslations[selectedLang] ||
    menuTranslations.en;

  const menuTitle =
    document.querySelector(".page-title");
  if (menuTitle) {
    menuTitle.innerText = t.menu;
  }

  const allTab =
    document.querySelector(".tab[onclick*=\"'all'\"]");
  if (allTab) {
    allTab.innerText = t.all;
  }

  document
    .querySelectorAll(".available-label")
    .forEach(element => {
      element.innerText =
        t.availableBalance;
    });

  document
    .querySelectorAll(".commission-label")
    .forEach(element => {
      element.innerText =
        t.commissions;
    });

  const noMore =
    document.querySelector(".no-more");
  if (noMore) {
    noMore.innerText = t.noMore;
  }


  const navItems =
    document.querySelectorAll(".bottom-nav .nav-item");

  if (navItems.length >= 5) {
    navItems[0].querySelector("div").innerText =
      t.home;
    navItems[1].querySelector("div").innerText =
      t.service;
    navItems[2].querySelector("div").innerText =
      t.menu;
    navItems[3].querySelector("div").innerText =
      t.record;
    navItems[4].querySelector("div").innerText =
      t.mine;
  }
}

applyMenuLanguage();
