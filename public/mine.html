<script>
  const img = document.getElementById("profileImg");

const token = localStorage.getItem("token");

if (!token) {
  window.location.href = "login.html";
}

async function loadProfileImage() {

  try {

    const res = await fetch("/get-profile-image", {
      headers: {
        Authorization: "Bearer " + token
      }
    });

    const data = await res.json();

    if (data.success && data.image) {

      img.src = data.image;

    } else {

      img.src = "default.png";
    }

  } catch (err) {

    img.src = "default.png";
  }
}

loadProfileImage();

async function checkWithdrawPassword() {

  const token = localStorage.getItem("token");

  try {

    const res = await fetch("/get-wallet", {
      headers: {
        Authorization: "Bearer " + token
      }
    });

    const data = await res.json();

    if (
      !data.success ||
      !data.wallet ||
      !data.wallet.locked ||
      !data.wallet.address
    ) {
      const currentTexts =
  texts[lang] || texts.en;

showMessage(currentTexts.pleaseAddWallet);
      return;
    }

    window.walletPassword = data.wallet.password;

document.getElementById("withdrawPopup").style.display = "flex";

  } catch (err) {

    const currentTexts =
  texts[lang] || texts.en;

showMessage(currentTexts.serverError);
  }
}

function closeWithdrawPopup() {

  document.getElementById("withdrawPopup").style.display = "none";
}

function submitWithdrawPassword() {

  const inputPass =
    document.getElementById("withdrawPassword").value;

  if (!inputPass) {

    const currentTexts =
  texts[lang] || texts.en;

showMessage(currentTexts.enterWithdrawalPasswordError);
    return;
  }

  if (inputPass === window.walletPassword) {

    sessionStorage.setItem("withdrawAccess", "true");

    window.location.href = "withdraw.html";

  } else {

    const currentTexts =
  texts[lang] || texts.en;

showMessage(currentTexts.wrongPassword);
  }
}
