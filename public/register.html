<!DOCTYPE html>
<html>
<head>
  <title>Register</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="logo.png">

  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#f5f5f5;
    }

    .container{
      padding:20px;
      max-width:920px;
      margin:auto;
    }

    .top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-top:10px;
    }

    .back{
      font-size:22px;
      cursor:pointer;
    }

    .lang{
      border:1px solid #ddd;
      padding:6px 10px;
      border-radius:8px;
      font-size:14px;
      background:#fff;
      cursor:pointer;
    }

    .current-flag{
  width:24px;
  height:16px;
  object-fit:cover;
  border-radius:2px;
  vertical-align:middle;
  margin-right:6px;
}

.language-popup-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.35);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

.language-popup{
  width:320px;
  max-width:90%;
  max-height:70vh;
  background:#fff;
  border-radius:12px;
  overflow-y:auto;
  box-shadow:0 8px 30px rgba(0,0,0,0.25);
}

.language-option{
  display:flex;
  align-items:center;
  gap:10px;
  padding:13px 16px;
  border-bottom:1px solid #eee;
  font-size:14px;
  color:#333;
  cursor:pointer;
  background:#fff;
}

.language-option:hover{
  background:#f5f5f5;
}

.language-option:last-child{
  border-bottom:none;
}

.flag{
  width:24px;
  height:16px;
  object-fit:cover;
  border-radius:2px;
  flex-shrink:0;
}

    h1{
      margin-top:30px;
      font-size:22px;
      color:#555;
    }

    h2{
      margin-top:5px;
      font-size:26px;
      color:#333;
    }

    .input-box{
      background:#fff;
      border:1px solid #ddd;
      border-radius:10px;
      padding:12px;
      margin-top:15px;
      display:flex;
      align-items:center;
    }

    .input-box input{
      border:none;
      outline:none;
      width:100%;
      font-size:16px;
      background:transparent;
    }

    .register-btn{
      margin-top:20px;
      width:100%;
      padding:14px;
      background:#38b014;
      color:white;
      border:none;
      border-radius:10px;
      font-size:16px;
      cursor:pointer;
    }

    .login-link{
      text-align:right;
      margin-top:15px;
      color:#b81818;
      cursor:pointer;
    }

    .custom-message{
      position:fixed;
      top:30px;
      left:50%;
      transform:translateX(-50%);
      background:#222;
      color:#fff;
      padding:14px 25px;
      border-radius:10px;
      font-size:16px;
      z-index:9999;
      display:none;
      animation:fadeIn 0.3s ease;
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateX(-50%) translateY(-10px);
      }

      to{
        opacity:1;
        transform:translateX(-50%) translateY(0);
      }
    }
  </style>
</head>

<body>

<div class="container">

</div>

  <h1 id="welcome">Hello,Welcome!</h1>

  <div class="input-box">

</div>

async function registerUser() {
  const username =
    document.getElementById("username").value.trim();
  const password =
    document.getElementById("password").value.trim();
  const confirmPassword =
    document.getElementById("confirmPassword").value.trim();
  const inviteCode =
    document.getElementById("invite").value.trim();
  const lang =
    localStorage.getItem("lang") || "en";
  const t =
    translations[lang] || translations.en;

  if (!username || !password || !confirmPassword || !inviteCode) {
    showMessage(t.fillAll);
    return;
  }

  if (username.includes(" ")) {
    showMessage(t.usernameSpace);
    return;
  }

  if (password.includes(" ")) {
    showMessage(t.passwordSpace);
    return;
  }

  if (password !== confirmPassword) {
    showMessage(t.passwordMatch);
    return;
  }

  try {

    const res = await fetch("/register", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        username,
        password,
        inviteCode
      })

    });

    const data = await res.json();

    if (data.success) {
      showMessage(t.success);
      setTimeout(() => {
        window.location.href = "login.html";
      }, 3000);
      return;
    }

    if (
      data.msg === "Username already exists" ||
      data.msg === "Username already exist"
    ) {
      showMessage(t.usernameExists);
      return;
    }

    if (
      data.msg === "Invalid invitation code" ||
      data.msg === "Invalid invite code"
    ) {
      showMessage(t.invalidInvite);
      return;
    }
    showMessage(t.failed);
  } catch (err) {
    showMessage(t.serverError);
  }
}

function showMessage(text) {
  const msg =
    document.getElementById("customMessage");
  msg.innerText = text;
  msg.style.display = "block";
  setTimeout(() => {
    msg.style.display = "none";
  }, 3000);

}

function goLogin(){
  window.location.href = "login.html";
}

function changeLang(lang){
  localStorage.setItem("lang", lang);
  const t =
    translations[lang] || translations.en;
  document.getElementById("welcome").innerText =
    t.welcome;
  document.getElementById("title").innerText =
    t.title;
  document.getElementById("username").placeholder =
    t.username;
  document.getElementById("password").placeholder =
    t.password;
  document.getElementById("confirmPassword").placeholder =
    t.confirmPassword;
  document.getElementById("invite").placeholder =
    t.invite;
  document.querySelector(".register-btn").innerText =
    t.register;
  document.querySelector(".login-link").innerText =
    t.backLogin;

  const flagFile =
    flags[lang] || flags.en;

  const languageName =
    names[lang] || names.en;

  document.getElementById("currentLanguage").innerHTML = `
    <img
      src="flags/${flagFile}"
      class="current-flag"
      alt="${languageName}"
    >
    <span>${languageName}</span>
  `;

  if(
    lang === "ar" ||
    lang === "ur" ||
    lang === "fa"
  ){
    document.body.dir = "rtl";
  }else{
    document.body.dir = "ltr";
  }

  document.getElementById(
    "languagePopupOverlay"
  ).style.display = "none";
}

function toggleLanguage(){
  const popup =
    document.getElementById(
      "languagePopupOverlay"
    );
  popup.style.display = "flex";
}

window.onload = function () {
  const lang =
    localStorage.getItem("lang") || "en";
    lang;
  changeLang(lang);

  const params =
    new URLSearchParams(window.location.search);

  const code =
    params.get("code");
  if(code){
    document.getElementById("invite").value =
      code;
  }

};
